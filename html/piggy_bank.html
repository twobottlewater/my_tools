<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的存钱罐助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 全局样式 - 保持与 btc.html 一致的高级感，但使用温暖的色调代表通过积累财富 */
        body {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            max-width: 800px;
            /* 存钱罐不需要太宽，聚焦一点 */
        }

        /* 卡片通用样式 */
        .card {
            border: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            margin-bottom: 25px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
        }

        /* 页面标题 */
        h3 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* 顶部资产大卡片 */
        .main-stat-card {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            /* 稍微深一点的粉红/橙色渐变，区别于存钱罐背景 */
            background: linear-gradient(120deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(245, 87, 108, 0.4);
            position: relative;
            overflow: hidden;
        }

        .main-stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-10%, -10%);
            }
        }

        .main-val {
            font-size: 3.5rem;
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }

        .sub-val {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* 进度条样式 */
        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            height: 12px;
            margin-top: 15px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            border-radius: 20px;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 按钮样式 */
        .btn-action {
            height: 100%;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.1rem;
            border-radius: 12px;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: white !important;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-deposit {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .btn-target {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .stat-label {
            color: #718096;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
        }

        /* 历史记录表格 */
        .history-table th {
            background: rgba(246, 211, 101, 0.2);
            color: #d35400;
            font-weight: 600;
        }

        .badge-deposit {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .badge-withdraw {
            background-color: #e8f5e9;
            color: #1b5e20;
        }

        .badge-target {
            background-color: #fff3e0;
            color: #e65100;
        }

        /* 模态框美化 */
        .modal-header {
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            color: white;
            border: none;
        }

        .text-plus {
            color: #e53e3e;
            font-weight: bold;
        }

        .text-minus {
            color: #38a169;
            font-weight: bold;
        }

        /* 股票里绿色常代表跌/出，这里代表转出 */
    </style>
</head>

<body>

    <div class="container py-4">
        <h3 class="text-center mb-4">🐷 我的存钱罐助手</h3>

        <!-- 核心卡片：存钱罐余额 -->
        <div class="card main-stat-card text-center p-4">
            <div class="mb-2 opacity-75">当前存钱罐余额 (元)</div>
            <div class="main-val" id="displayBalance">0.00</div>

            <!-- 目标进度条 -->
            <div class="mt-3 px-4">
                <div class="d-flex justify-content-between small mb-1">
                    <span>目标进度</span>
                    <span><span id="displayPercent">0</span>% / 目标 <span id="displayTargetSmall">1000</span></span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div class="mt-2 small opacity-75" id="targetMessage">加油！再存一点就可以增加股票本金了！</div>
            </div>
        </div>

        <!-- 统计信息卡片 -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card h-100 p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <div class="stat-label">🏆 累计已存入</div>
                            <div class="stat-val text-danger" id="displayTotalSaved">0.00</div>
                            <div class="small text-muted">滴水穿石，积少成多</div>
                        </div>
                        <div style="font-size: 2.5rem; opacity: 0.2;">📥</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <div class="stat-label">🚀 累计已转入股票账户</div>
                            <div class="stat-val text-success" id="displayTotalTransferred">0.00</div>
                            <div class="small text-muted">为投资提供弹药</div>
                        </div>
                        <div style="font-size: 2.5rem; opacity: 0.2;">📤</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作按钮区 -->
        <div class="row g-3 mb-4">
            <div class="col-4">
                <button class="btn btn-action btn-deposit w-100" data-bs-toggle="modal" data-bs-target="#depositModal">
                    <div class="mb-1">💰</div>
                    <span>存入一笔</span>
                    <span style="font-size: 0.7rem; font-weight: normal; opacity: 0.8; margin-top: 4px;">日常积累</span>
                </button>
            </div>
            <div class="col-4">
                <button class="btn btn-action btn-withdraw w-100" data-bs-toggle="modal"
                    data-bs-target="#withdrawModal">
                    <div class="mb-1">🏦</div>
                    <span>转出股票</span>
                    <span style="font-size: 0.7rem; font-weight: normal; opacity: 0.8; margin-top: 4px;">达到目标</span>
                </button>
            </div>
            <div class="col-4">
                <button class="btn btn-action btn-target w-100" data-bs-toggle="modal" data-bs-target="#targetModal">
                    <div class="mb-1">🎯</div>
                    <span>设置目标</span>
                    <span style="font-size: 0.7rem; font-weight: normal; opacity: 0.8; margin-top: 4px;">调整计划</span>
                </button>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="card">
            <div
                class="card-header bg-white border-bottom-0 d-flex justify-content-between align-items-center pt-3 px-3">
                <span class="fw-bold">📝 存取流水记录</span>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary" onclick="exportData()">备份数据</button>
                    <button class="btn btn-sm btn-outline-secondary"
                        onclick="document.getElementById('importFile').click()">恢复数据</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="undoLastAction()" id="undoBtn" disabled>↶
                        撤销</button>
                    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData()">
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover history-table mb-0 text-center align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>时间</th>
                                <th>操作</th>
                                <th>金额</th>
                                <th>备注</th>
                                <th>存钱罐余额</th>
                            </tr>
                        </thead>
                        <tbody id="logsBody">
                            <!-- JS 填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 存钱模态框 -->
    <div class="modal fade" id="depositModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">💰 存入一笔钱</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">存入金额 (元)</label>
                        <input type="number" class="form-control form-control-lg" id="depositAmount"
                            placeholder="例如: 50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">备注 (可选)</label>
                        <input type="text" class="form-control" id="depositNote" placeholder="例如: 省下的咖啡钱">
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary flex-grow-1"
                            onclick="quickAdd(10)">+10</button>
                        <button type="button" class="btn btn-outline-secondary flex-grow-1"
                            onclick="quickAdd(20)">+20</button>
                        <button type="button" class="btn btn-outline-secondary flex-grow-1"
                            onclick="quickAdd(50)">+50</button>
                        <button type="button" class="btn btn-outline-secondary flex-grow-1"
                            onclick="quickAdd(100)">+100</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary w-100 btn-lg" onclick="actionDeposit()">确认存入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 取出/转出模态框 -->
    <div class="modal fade" id="withdrawModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success">
                    <h5 class="modal-title">🏦 转出到股票账户</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-success">
                        🎉 这里的钱将“清空”或减少，并记为“已转入股票账户”。
                    </div>
                    <div class="mb-3">
                        <label class="form-label">转出金额 (元)</label>
                        <div class="input-group">
                            <input type="number" class="form-control form-control-lg" id="withdrawAmount">
                            <button class="btn btn-outline-secondary" type="button"
                                onclick="fillAllBalance()">全部转出</button>
                        </div>
                        <div class="form-text">当前可转出余额: <span id="modalCurrentBalance">0.00</span> 元</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <input type="text" class="form-control" id="withdrawNote" value="充值股票账户">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success w-100 btn-lg" onclick="actionWithdraw()">确认转出</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 目标设置模态框 -->
    <div class="modal fade" id="targetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">🎯 设置目标金额</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">当存够多少钱时准备转出？</label>
                    <input type="number" class="form-control form-control-lg" id="targetInput">
                    <div class="form-text">设置一个小目标，更容易坚持哦！</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-warning w-100" onclick="actionSetTarget()">保存设置</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- 核心数据结构 ---
        let appData = {
            balance: 0,           // 当前存钱罐余额
            target: 1000,         // 默认目标
            totalSaved: 0,        // 累计存入
            totalTransferred: 0,  // 累计转出(到股票)
            logs: []              // 记录
        };

        // --- 历史记录栈 (撤销功能) ---
        let historyStack = [];
        const MAX_HISTORY = 20;

        // --- 初始化 ---
        window.onload = function () {
            loadData();
            renderUI();
            updateUndoButton();
        };

        // --- 数据持久化 ---
        function loadData() {
            const saved = localStorage.getItem('piggy_bank_data_v1');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                    // 确保数据结构完整
                    if (typeof appData.balance !== 'number') appData.balance = 0;
                    if (!appData.target) appData.target = 1000;
                    if (!appData.logs) appData.logs = [];
                } catch (e) {
                    console.error("数据加载失败", e);
                }
            }

            const historySaved = localStorage.getItem('piggy_bank_history');
            if (historySaved) {
                try { historyStack = JSON.parse(historySaved); } catch (e) { }
            }
        }

        function saveData() {
            localStorage.setItem('piggy_bank_data_v1', JSON.stringify(appData));
            localStorage.setItem('piggy_bank_history', JSON.stringify(historyStack));
        }

        // --- 撤销系统 ---
        function saveToHistory(actionName) {
            historyStack.push({
                data: JSON.parse(JSON.stringify(appData)),
                action: actionName,
                time: new Date().getTime()
            });
            if (historyStack.length > MAX_HISTORY) historyStack.shift();
            updateUndoButton();
        }

        function undoLastAction() {
            if (historyStack.length === 0) return;
            const last = historyStack.pop();
            appData = last.data;
            saveData();
            renderUI();
            updateUndoButton();
            alert(`已撤销操作: ${last.action}`);
        }

        function updateUndoButton() {
            document.getElementById('undoBtn').disabled = historyStack.length === 0;
        }

        // --- UI 渲染 ---
        function renderUI() {
            // 1. 金额展示
            document.getElementById('displayBalance').innerText = formatMoney(appData.balance);
            document.getElementById('displayTotalSaved').innerText = formatMoney(appData.totalSaved);
            document.getElementById('displayTotalTransferred').innerText = formatMoney(appData.totalTransferred);

            // 2. 进度条
            document.getElementById('displayTargetSmall').innerText = formatMoney(appData.target);

            let percent = 0;
            if (appData.target > 0) {
                percent = (appData.balance / appData.target) * 100;
            }
            if (percent > 100) percent = 100; // 视觉上不溢出

            document.getElementById('displayPercent').innerText = percent.toFixed(1);
            document.getElementById('progressBar').style.width = percent + "%";

            // 进度提示语
            const msgEl = document.getElementById('targetMessage');
            if (appData.balance >= appData.target) {
                msgEl.innerText = "🎉 恭喜！目标已达成，可以转出到股票账户了！";
                msgEl.classList.remove('text-white-50');
                msgEl.classList.add('text-white', 'fw-bold');
            } else {
                let left = appData.target - appData.balance;
                msgEl.innerText = `加油！距离目标还差 ${formatMoney(left)} 元`;
            }

            // 3. 模态框数据
            document.getElementById('modalCurrentBalance').innerText = formatMoney(appData.balance);
            document.getElementById('targetInput').value = appData.target;

            // 4. 日志列表
            const tbody = document.getElementById('logsBody');
            tbody.innerHTML = '';
            appData.logs.slice().reverse().forEach(log => {
                let badgeClass = 'badge-deposit';
                let amountClass = 'text-plus';
                let prefix = '+';

                if (log.type === 'withdraw') {
                    badgeClass = 'badge-withdraw';
                    amountClass = 'text-minus';
                    prefix = '-';
                } else if (log.type === 'target') {
                    badgeClass = 'badge-target';
                    amountClass = 'text-dark';
                    prefix = '';
                }

                const row = `
                <tr>
                    <td><small class="text-secondary">${formatDate(new Date(log.timestamp))}</small></td>
                    <td><span class="badge ${badgeClass} p-2">${log.typeName}</span></td>
                    <td class="${amountClass} fw-bold">${prefix}${formatMoney(log.amount)}</td>
                    <td class="text-muted small">${log.note || '-'}</td>
                    <td><small>${formatMoney(log.snapBalance)}</small></td>
                </tr>
            `;
                tbody.innerHTML += row;
            });
        }

        // --- 业务操作 ---
        function actionDeposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            const note = document.getElementById('depositNote').value;

            if (isNaN(amount) || amount <= 0) return alert("请输入正确的金额");

            saveToHistory("存入 " + amount);

            appData.balance += amount;
            appData.totalSaved += amount;

            addLog('deposit', '存入', amount, note);
            saveData();
            renderUI();

            // 关闭模态框
            bootstrap.Modal.getInstance(document.getElementById('depositModal')).hide();
            document.getElementById('depositAmount').value = '';
            document.getElementById('depositNote').value = '';
        }

        function actionWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const note = document.getElementById('withdrawNote').value;

            if (isNaN(amount) || amount <= 0) return alert("请输入正确的金额");
            if (amount > appData.balance) return alert("余额不足，无法转出");

            saveToHistory("转出至股票 " + amount);

            appData.balance -= amount;
            appData.totalTransferred += amount;

            addLog('withdraw', '转出股票', amount, note);
            saveData();
            renderUI();

            bootstrap.Modal.getInstance(document.getElementById('withdrawModal')).hide();
            document.getElementById('withdrawAmount').value = '';
        }

        function actionSetTarget() {
            const val = parseFloat(document.getElementById('targetInput').value);
            if (isNaN(val) || val <= 0) return alert("请输入正确的目标金额");

            saveToHistory("修改目标");
            appData.target = val;

            // 只有大幅修改才记录日志，避免刷屏，或者简单的记录
            // addLog('target', '修改目标', val, '新目标');

            saveData();
            renderUI();
            bootstrap.Modal.getInstance(document.getElementById('targetModal')).hide();
        }

        // --- 辅助功能 ---
        function addLog(type, typeName, amount, note) {
            appData.logs.push({
                type: type,
                typeName: typeName,
                amount: amount,
                note: note,
                snapBalance: appData.balance,
                timestamp: new Date().getTime()
            });
        }

        function formatMoney(num) {
            return parseFloat(num).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDate(date) {
            return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function quickAdd(val) {
            const input = document.getElementById('depositAmount');
            let current = parseFloat(input.value);
            if (isNaN(current)) current = 0;
            input.value = current + val;
        }

        function fillAllBalance() {
            document.getElementById('withdrawAmount').value = appData.balance;
        }

        // --- 导入导出 ---
        function exportData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `piggy_bank_backup_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
        }

        function importData() {
            const file = document.getElementById('importFile').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const loaded = JSON.parse(e.target.result);
                    if (confirm("确定要覆盖当前数据吗？")) {
                        appData = loaded;
                        saveData();
                        renderUI();
                        historyStack = []; // 清空历史
                        updateUndoButton();
                        alert("数据恢复成功！");
                    }
                } catch (err) {
                    alert("文件格式错误");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>

</html>
